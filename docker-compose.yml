services:
  db:
    image: postgres:16-alpine
    container_name: wds-food-delivery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wds
      POSTGRES_PASSWORD: wds
      POSTGRES_DB: wds_food_delivery
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wds -d wds_food_delivery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
